# Broker MQTT de CREO FlowTwin (ADR-24). Lo usan los nodos ESP32 para enviar lecturas y latidos.
# Nadie entra sin usuario: las cuentas y permisos los administra el backend con el plugin
# Dynamic Security (cada nodo solo puede publicar en sus temas y leer sus respuestas).

# Desarrollo: sin TLS en el puerto 1883. En la clínica se usa el listener 8883 con certificado
# (ver la sección «MQTT en la clínica» del README del backend).
listener 1883
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Mensajes QoS 1 guardados en disco: si el backend se reinicia, el broker los entrega al volver
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Un lote de 200 lecturas pesa ~12 KB: 64 KB deja margen sin aceptar mensajes gigantes
max_packet_size 65536
# Si el backend estuvo caído, cuántos mensajes guarda por sesión antes de descartar los más nuevos
max_queued_messages 20000

log_dest stdout
log_type error
log_type warning
log_type notice
