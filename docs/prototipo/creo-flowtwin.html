<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head><body><title>CREO FlowTwin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: barra lateral negra fija + área de trabajo cálida; el gemelo es el protagonista. Tema único claro, elegido a propósito. */
:root{
  --negro:#1A1A1A; --negro-2:#262324; --negro-3:#3A3536;
  --rojo:#A60437; --rojo-osc:#850330; --rojo-suave:#F7E6EB;
  --amarillo:#FBB62F; --amarillo-suave:#FFF3D6;
  --blanco:#FFFFFF; --fondo:#F7F4EF; --fondo-2:#EFEAE3;
  --tinta:#1F1B1C; --gris:#6E6668; --gris-2:#9A9294; --linea:#E6DFD7;
  --alta:#E53935; --media:#F2A900; --baja:#2E9E6B; --nd:#B0B0B0;
  --alta-s:#FDECEA; --media-s:#FFF6DC; --baja-s:#E7F5EE; --nd-s:#F0EFEE;
  --f-disp:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px; --sombra:0 1px 2px rgba(31,27,28,.05),0 4px 14px rgba(31,27,28,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800}
h2{font-size:17px;font-weight:800}
h3{font-size:14px;font-weight:800}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Login ---------- */
.login{display:grid;grid-template-columns:1fr 1fr;min-height:100%}
.login-l{background:var(--negro);color:#fff;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.login-l .pitch{display:flex;flex-direction:column;gap:14px;max-width:460px}
.login-l .eyebrow{color:var(--amarillo);font-weight:700;display:flex;align-items:center;gap:8px}
.login-l .eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amarillo)}
.login-l h1{font-size:44px;line-height:1.1;font-weight:900;color:#fff}
.login-l p{color:#BDB5B7;margin:0;font-size:16px}
.login-l small{color:#8C8486}
.login-r{display:flex;align-items:center;justify-content:center;padding:48px 24px}
.login-box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.login-box .sub{color:var(--gris);margin:-8px 0 4px}
.demo-acc{border-top:1px solid var(--linea);padding-top:18px;display:flex;flex-direction:column;gap:8px}
.lbl-up{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gris)}
@media (max-width:860px){.login{grid-template-columns:1fr}.login-l{padding:32px 20px}.login-l h1{font-size:32px}}

/* ---------- Form ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:13px}
.inp,select.inp{border:1px solid var(--linea);background:#fff;border-radius:10px;padding:10px 12px;min-height:42px;width:100%}
.inp:focus{border-color:var(--negro-3);outline:none;box-shadow:0 0 0 3px rgba(251,182,47,.35)}
.hint{color:var(--gris);font-size:12px}
.err{color:var(--alta);font-size:13px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid transparent;padding:9px 14px;font-weight:700;min-height:40px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn svg{width:16px;height:16px;flex:none}
.btn-p{background:var(--rojo);color:#fff}.btn-p:hover{background:var(--rojo-osc)}
.btn-n{background:var(--negro);color:#fff}.btn-n:hover{background:var(--negro-3)}
.btn-o{background:#fff;border-color:var(--linea);color:var(--tinta)}.btn-o:hover{border-color:var(--gris-2)}
.btn-g{background:transparent;color:var(--tinta)}.btn-g:hover{background:var(--fondo-2)}
.btn-sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-block{width:100%}
.link{background:none;border:0;padding:0;color:var(--tinta);text-decoration:underline;text-underline-offset:3px;font-weight:600}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--negro);color:#E9E4E5;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:22px 14px}
.side .brand{padding:0 8px 22px}
.side .brand small{display:block;color:#9F9799;font-size:11.5px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;color:#CFC8C9;text-decoration:none;padding:10px 12px;border-radius:10px;font-weight:600}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--negro-2);color:#fff}
.nav a.on{background:var(--rojo);color:#fff}
.side .me{margin-top:auto;border-top:1px solid var(--negro-3);padding:14px 8px 0;display:flex;flex-direction:column;gap:8px}
.side .me b{color:#fff;font-weight:700}
.side .me span{color:#9F9799;font-size:12px}
.side .me button{background:none;border:0;color:#CFC8C9;display:flex;gap:8px;align-items:center;padding:6px 0;font-weight:600}
.side .me button svg{width:16px;height:16px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(247,244,239,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:14px;padding:12px 28px;min-height:62px}
.crumbs{color:var(--gris);font-weight:600;display:flex;gap:6px;align-items:center;min-width:0;flex-wrap:wrap}
.crumbs b{color:var(--tinta)}
.top .sp{flex:1}
.live{display:inline-flex;align-items:center;gap:8px;background:var(--negro);color:#fff;border-radius:999px;padding:5px 12px 5px 10px;font-weight:700;font-size:12.5px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--amarillo);box-shadow:0 0 0 0 rgba(251,182,47,.7);animation:pulse 2s infinite}
.live.off i{background:#8C8486;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(251,182,47,.6)}70%{box-shadow:0 0 0 8px rgba(251,182,47,0)}100%{box-shadow:0 0 0 0 rgba(251,182,47,0)}}
.ro{background:var(--amarillo-suave);color:#7A5300;border:1px solid #F3D99A;border-radius:999px;padding:4px 10px;font-weight:700;font-size:12px}
.iconbtn{position:relative;width:40px;height:40px;border-radius:10px;border:1px solid var(--linea);background:#fff;display:inline-flex;align-items:center;justify-content:center}
.iconbtn svg{width:18px;height:18px}
.badge{position:absolute;top:-6px;right:-6px;background:var(--alta);color:#fff;border-radius:999px;font-size:11px;font-weight:800;min-width:19px;height:19px;padding:0 5px;display:flex;align-items:center;justify-content:center;border:2px solid var(--fondo)}
.dd{position:absolute;right:0;top:48px;width:340px;background:#fff;border:1px solid var(--linea);border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.12);padding:8px;z-index:40}
.dd-item{display:flex;gap:10px;padding:10px;border-radius:8px;align-items:flex-start;text-align:left;background:none;border:0;width:100%}
.dd-item:hover{background:var(--fondo)}
.dd-item .dot{margin-top:5px}
.usr{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--linea);border-radius:10px;padding:5px 10px 5px 6px;font-weight:700}
.av{width:30px;height:30px;border-radius:8px;background:var(--negro);color:var(--amarillo);display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-weight:900;font-size:13px}
.usr small{display:block;color:var(--gris);font-weight:600;font-size:11.5px;line-height:1.1}
.content{padding:24px 28px 12px;display:flex;flex-direction:column;gap:18px;flex:1}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;justify-content:space-between}
.page-head p{margin:4px 0 0;color:var(--gris)}
.demo-foot{margin:6px 28px 20px;color:var(--gris);font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--linea);padding-top:12px}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .main,.side{min-width:0}
  .side{position:static;height:auto;padding:14px 16px;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap}
  .side .brand{padding:0}
  .nav{flex-direction:row;overflow-x:auto;flex:1 1 100%;order:3}
  .nav a{white-space:nowrap}
  .side .me{display:none}
  .top{padding:10px 16px;flex-wrap:wrap}
  .content{padding:18px 16px}
  .demo-foot{margin:6px 16px 16px}
}

/* ---------- Cards & atoms ---------- */
.card{background:#fff;border:1px solid var(--linea);border-radius:var(--r);box-shadow:var(--sombra)}
.pad{padding:18px}
.card-h{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:16px 18px 0;flex-wrap:wrap}
.card-h p{margin:2px 0 0;color:var(--gris);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-weight:700;font-size:12px;background:var(--fondo-2);color:var(--tinta);white-space:nowrap}
.chip.baja{background:var(--baja-s);color:#1E6E4A}
.chip.media{background:var(--media-s);color:#7A5300}
.chip.alta{background:var(--alta-s);color:#B3261E}
.chip.nd{background:var(--nd-s);color:#6E6668}
.chip.dark{background:var(--negro);color:#fff}
.chip.red{background:var(--rojo-suave);color:var(--rojo)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.baja{background:var(--baja)}.dot.media{background:var(--media)}.dot.alta{background:var(--alta)}.dot.nd{background:var(--nd)}
.seg{display:inline-flex;background:var(--fondo-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--gris)}
.seg button.on{background:#fff;color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .k{color:var(--gris);font-weight:700;font-size:12.5px}
.kpi .v{font-family:var(--f-disp);font-weight:900;font-size:30px;line-height:1.1}
.kpi .v small{font-size:15px;color:var(--gris);font-weight:700}
.kpi .c{color:var(--gris-2);font-size:12px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.empty{border:1.5px dashed var(--linea);border-radius:var(--r);padding:22px;color:var(--gris);text-align:center}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;color:var(--gris);font-weight:700;font-size:12px;padding:10px 12px;border-bottom:1px solid var(--linea);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--linea);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--fondo)}
.tbl .mono{font-variant-numeric:tabular-nums;font-weight:700}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag-id{font-family:var(--f-disp);font-weight:900;letter-spacing:.01em}

/* ---------- Admisión ---------- */
.adm{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:18px;align-items:start}
.adm .col{display:flex;flex-direction:column;gap:14px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:1.5px solid var(--linea);background:#fff;border-radius:var(--r);padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:2px}
.mode b{font-family:var(--f-disp);font-size:18px;font-weight:800}
.mode span{color:var(--gris)}
.mode.on{background:var(--negro);border-color:var(--negro);color:#fff}
.mode.on span{color:#BDB5B7}
.scan-row{display:flex;gap:10px}
.scan-row .inp{font-size:24px;font-family:var(--f-disp);font-weight:800;min-height:58px;letter-spacing:.02em}
.scan-row .btn{min-height:58px;padding:0 22px;font-size:15px}
.result{border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:8px;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.98);opacity:.6}to{transform:none;opacity:1}}
.result.ok{background:var(--baja-s);border:1.5px solid #BFE3D0}
.result.info{background:#fff;border:1.5px solid var(--linea)}
.result.error{background:var(--alta-s);border:1.5px solid #F5C2BE}
.result .big{font-family:var(--f-disp);font-weight:900;font-size:56px;line-height:1;letter-spacing:.01em}
.result .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border-radius:10px;padding:12px 14px}
.tile b{display:block;font-family:var(--f-disp);font-size:28px;font-weight:900;line-height:1.1}
.tile span{font-weight:700;font-size:12.5px}
.tile.t1{background:var(--baja-s);color:#1E6E4A}.tile.t2{background:var(--fondo-2)}.tile.t3{background:var(--media-s);color:#7A5300}.tile.t4{background:var(--alta-s);color:#B3261E}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--linea);border-radius:10px;padding:10px 12px;background:#fff}
.li.warn{background:var(--media-s);border-color:#F3DFA6}
.li p{margin:0;font-size:12px;color:var(--gris)}
.ops{display:flex;flex-direction:column}
.op{display:grid;grid-template-columns:44px 96px 1fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--linea);font-size:13px}
.helpbox{background:var(--amarillo-suave);border:1px dashed #E9C978;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#5F4500;display:flex;flex-direction:column;gap:6px}
.helpbox .kbd{display:inline-block;background:#fff;border:1px solid #E9C978;border-radius:6px;padding:1px 6px;margin:2px 2px 0 0;font-weight:800;cursor:pointer}
@media (max-width:1000px){.adm{grid-template-columns:1fr}}

/* ---------- Gemelo ---------- */
.twin-grid{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(300px,1fr);gap:18px;align-items:start}
.twin-card{position:relative;overflow:hidden}
.twin-stage{position:relative;padding:6px 10px 10px;min-height:440px}
.twin-stage svg{width:100%;height:auto;display:block;max-height:560px}
.legend{position:absolute;left:16px;bottom:14px;background:rgba(255,255,255,.94);border:1px solid var(--linea);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;font-size:12px}
.legend b{font-size:12px}
.legend div{display:flex;gap:8px;align-items:center}
.zone-g{cursor:pointer}
.zone-g:hover .zfloor{filter:brightness(.97)}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--negro);color:#fff;border-radius:10px;padding:10px 12px;font-size:12.5px;min-width:200px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.tip b{font-family:var(--f-disp);font-size:14px}
.tip div{color:#D8D1D2}
.feed-card{display:flex;flex-direction:column;max-height:calc(100vh - 230px);min-height:420px}
.feed{overflow:auto;padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px}
.fc{display:flex;gap:12px;align-items:center;border:1px solid var(--linea);border-left:4px solid var(--linea);border-radius:10px;padding:10px 12px;background:#fff;text-align:left;width:100%}
.fc:hover{border-color:var(--gris-2)}
.fc.w1{border-left-color:var(--media)}.fc.w2{border-left-color:var(--alta)}.fc.done{border-left-color:var(--negro-3)}
.fc .ic{width:34px;height:34px;border-radius:9px;background:var(--fondo-2);display:flex;align-items:center;justify-content:center;flex:none}
.fc .ic svg{width:17px;height:17px}
.fc .mid{flex:1;min-width:0}
.fc .mid b{font-family:var(--f-disp);font-weight:900;font-size:15px}
.fc .mid p{margin:0;color:var(--gris);font-size:12.5px}
.fc .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--gris)}
.fc.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:var(--amarillo-suave)}100%{background:#fff}}
@media (max-width:1100px){.twin-grid{grid-template-columns:1fr}.feed-card{max-height:none}}

/* ---------- Historial ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters .field{min-width:150px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--gris)}
.hm{display:grid;gap:3px;font-size:11px}
.hm .c{border-radius:4px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums}
.hm .lab{color:var(--gris);display:flex;align-items:center;font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
@media (max-width:1100px){.two{grid-template-columns:1fr}}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:12px}

/* ---------- Detalle ---------- */
.tl{display:flex;height:54px;border-radius:10px;overflow:hidden;border:1px solid var(--linea)}
.tl div{display:flex;flex-direction:column;justify-content:center;padding:0 10px;min-width:0;font-size:12px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tl div small{font-weight:600;opacity:.8}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:70px 18px 1fr auto;gap:12px;align-items:start;padding:10px 0}
.step .line{display:flex;flex-direction:column;align-items:center;height:100%}
.step .line i{width:12px;height:12px;border-radius:50%;background:var(--negro);margin-top:4px}
.step .line s{flex:1;width:2px;background:var(--linea);margin-top:4px}

/* ---------- Seguimiento ---------- */
.zl{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--linea)}
.zl:last-child{border-bottom:0}
.zl .grow{flex:1;min-width:0}
.zl p{margin:2px 0 0;color:var(--gris);font-size:12.5px}
.sw{position:relative;width:46px;height:26px;border-radius:999px;background:var(--nd);border:0;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--rojo)}.sw.on::after{left:23px}
.sw[disabled]{opacity:.5;cursor:not-allowed}
.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.node{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.node .hd{display:flex;justify-content:space-between;align-items:center}

/* ---------- Editor ---------- */
.ed{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:16px;align-items:start}
.tree{padding:14px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.tree .t-sede{font-weight:800;font-family:var(--f-disp);display:flex;align-items:center;gap:8px;padding:6px 4px}
.tree .t-piso{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;background:none;border:0;width:100%;text-align:left;font-weight:700}
.tree .t-piso.on{background:var(--fondo-2)}
.tree .t-sub{padding:2px 0 6px 14px;display:flex;flex-direction:column;gap:2px}
.tree .t-z{background:none;border:0;text-align:left;padding:5px 8px;border-radius:6px;color:var(--gris);font-weight:600;display:flex;gap:8px;align-items:center}
.tree .t-z.on{color:var(--rojo);background:var(--rojo-suave)}
.tools{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--linea);align-items:center}
.tool{display:inline-flex;gap:6px;align-items:center;border:1px solid transparent;background:none;border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px;color:var(--gris)}
.tool svg{width:15px;height:15px}
.t-sede svg{width:16px;height:16px;flex:none}
.tool.on{background:var(--rojo-suave);color:var(--rojo);border-color:#EFC7D3}
.tool[disabled]{opacity:.4;cursor:not-allowed}
.canvas{padding:14px;background:var(--fondo);user-select:none}
.canvas svg{width:100%;height:auto;display:block;background:#fff;border-radius:8px;border:1px solid var(--linea);touch-action:none}
.props{padding:16px;display:flex;flex-direction:column;gap:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--linea);background:var(--fondo);border-radius:8px;padding:6px 10px;font-weight:700;font-size:12.5px;color:var(--gris)}
.chipbtn.on{border-color:var(--rojo);color:var(--rojo);background:var(--rojo-suave)}
.thr{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px}
.thr .inp{min-height:34px;padding:5px 8px;width:72px;text-align:right}
@media (max-width:1250px){.ed{grid-template-columns:220px minmax(0,1fr)}.ed .props-col{grid-column:1/-1}}
@media (max-width:800px){.ed{grid-template-columns:1fr}}

/* ---------- Modal / drawer / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(26,26,26,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:640px}
.m-h{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 8px;gap:10px}
.m-b{padding:8px 20px 6px;display:flex;flex-direction:column;gap:14px}
.m-f{padding:14px 20px 18px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.x{width:34px;height:34px;border-radius:8px;border:0;background:var(--fondo);display:flex;align-items:center;justify-content:center}
.x svg{width:16px;height:16px}
.drawer-scrim{justify-content:flex-end;align-items:stretch;padding:0}
.drawer{background:#fff;width:100%;max-width:400px;height:100%;overflow:auto;box-shadow:-12px 0 40px rgba(0,0,0,.2);animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.5}to{transform:none;opacity:1}}
.progress{display:flex;gap:6px}
.progress i{flex:1;height:5px;border-radius:9px;background:var(--fondo-2)}
.progress i.on{background:var(--rojo)}
.pwd{display:flex;gap:8px;align-items:center;background:var(--fondo);border:1px dashed var(--gris-2);border-radius:10px;padding:12px 14px;font-family:var(--f-disp);font-size:20px;font-weight:900;letter-spacing:.04em;justify-content:space-between}
.checks{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.checks span{display:flex;gap:6px;align-items:center;color:var(--gris)}
.checks span.ok{color:#1E6E4A}
.toasts{position:fixed;right:20px;bottom:20px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 40px)}
.toast{background:var(--negro);color:#fff;border-radius:10px;padding:12px 16px;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;animation:pop .2s ease-out;max-width:420px}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--baja);flex:none}
.toast.warn i{background:var(--media)}.toast.bad i{background:var(--alta)}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--linea);border-top-color:var(--rojo);animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.denied{max-width:480px;margin:60px auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}

function fakeAtencion(id, ini, tid, limite){
  const piloto = rnd() < .45;
  const e1 = ini + rint(1,3)*MIN;
  let esp = Math.round(clamp(gauss(23,8), 5, 55));
  let e2 = e1 + esp*MIN;
  const d2 = Math.round(piloto ? clamp(gauss(14,4),7,26) : clamp(gauss(15,5),6,30));
  let e3 = e2 + d2*MIN, e4 = e3 + rint(2,4)*MIN;
  if (limite && e4 > limite){ const s = (limite - ini) / (e4 - ini); esp = Math.max(5, Math.round(esp*s)); e2 = e1 + esp*MIN; e3 = e2 + Math.max(6, Math.round(d2*s))*MIN; e4 = Math.min(limite, e3 + 2*MIN); }
  return { id, tarjetaId:tid, inicio:ini, fin:e4, estado:'cerrada', motivo:'Devuelta', destino:piloto?'piloto':'otro', pisoId:'p1',
    eventos:[{zonaId:'z-adm',entrada:ini,salida:e1},{zonaId:'z-sala',entrada:e1,salida:e2},{zonaId:piloto?'z-cons':'externo',entrada:e2,salida:e3},{zonaId:'z-pas',entrada:e3,salida:e4}] };
}

const allZonas = () => S.pisos.flatMap(p => p.zonas.map(z => Object.assign(z, { pisoId:p.id })));
const zonaById = id => id==='externo' ? { id:'externo', nombre:'Otro consultorio', tipo:'Externo' } : allZonas().find(z=>z.id===id) || (S.pisos.flatMap(p=>p.borrador||[]).find(z=>z.id===id));
const nodoDeZona = z => S.nodos.find(n=>n.zonaId===z.id && n.estado!=='Baja');
const zonaActual = a => { const e = a.eventos[a.eventos.length-1]; return e && !e.salida ? e.zonaId : null; };
const activas = () => S.atenciones.filter(a=>a.estado==='activa');
const enZona = z => activas().filter(a=>zonaActual(a)===z.id);
const tipoZ = id => zonaById(id)?.tipo;
function espera(a){ const e = a.eventos.find(e => e.zonaId==='externo' || tipoZ(e.zonaId)==='Servicio'); return e ? mins(e.entrada - a.inicio) : null; }
function esperaCorriendo(a){ const v = espera(a); return v != null ? v : mins((a.fin||S.now) - a.inicio); }
function consulta(a){ let t = 0, any = false; a.eventos.forEach(e=>{ if (tipoZ(e.zonaId)==='Servicio'){ any = true; t += (e.salida||a.fin||S.now) - e.entrada; } }); return any ? mins(t) : null; }
const total = a => mins((a.fin||S.now) - a.inicio);
const avg = arr => { const v = arr.filter(x=>x!=null); return v.length ? Math.round(v.reduce((s,x)=>s+x,0)/v.length) : null; };
function nivel(z){
  if (z.tipo==='Tránsito' || z.tipo==='Salida') return 'neutral';
  if (z.pausa) return 'pausa';
  const n = nodoDeZona(z);
  if (!n || n.estado!=='En línea') return 'nd';
  const pct = enZona(z).length / Math.max(1, z.aforo) * 100;
  return pct > z.umb[1] ? 'alta' : pct > z.umb[0] ? 'media' : 'baja';
}
const NIV = { alta:'Alta', media:'Media', baja:'Baja', nd:'Sin datos', pausa:'Seguimiento pausado', neutral:'Tránsito' };
const COL = { alta:'#E53935', media:'#F2A900', baja:'#2E9E6B', nd:'#B0B0B0', pausa:'#B0B0B0', neutral:'#D9D3CC' };

/* ---------------- Simulación en vivo ---------------- */
function moveTo(a, zonaId){ const e = a.eventos[a.eventos.length-1]; if (e && !e.salida) e.salida = S.now; a.eventos.push({ zonaId, entrada:S.now, salida:null }); a.flash = true; }
function cerrar(a, motivo){ const e = a.eventos[a.eventos.length-1]; if (e && !e.salida) e.salida = S.now; a.fin = S.now; a.estado = 'cerrada'; a.motivo = motivo; }
const SIM_USER = { nombre:'Recepción (simulación)', rol:'Operador' };
function tick(){
  if (!S.simOn) return;
  S.now += 3*MIN;
  const cons = pisoById('p1').zonas.find(z=>z.id==='z-cons');
  activas().forEach(a => { a.flash = false; });
  activas().forEach(a => {
    const z = zonaActual(a), e = a.eventos[a.eventos.length-1], en = mins(S.now - e.entrada);
    if (z==='z-adm' && en >= 3 && rnd() < .75) moveTo(a,'z-sala');
    else if (z==='z-sala' && a.destino==='otro' && en >= a.wObj) moveTo(a,'externo');
    else if (z==='z-cons' && en >= a.dCons) moveTo(a,'z-pas');
    else if (z==='externo' && en >= 15 && rnd() < .4) moveTo(a,'z-pas');
  });
  if (enZona(cons).length===0 && !cons.pausa){
    const cola = enZona(pisoById('p1').zonas[1]).filter(a=>a.destino==='piloto').sort((x,y)=>x.inicio-y.inicio);
    if (cola[0]) moveTo(cola[0], 'z-cons');
  }
  activas().filter(a=>zonaActual(a)==='z-pas' && mins(S.now - a.eventos[a.eventos.length-1].entrada) >= 3 && rnd() < .5).forEach(a=>{
    const t = S.tarjetas.find(x=>x.id===a.tarjetaId);
    cerrar(a,'Devuelta'); t.estado='Por desinfectar'; t.atencionId=null; t.desde=S.now;
    S.ops.unshift({ t:S.now, tipo:'Recibida', tarjeta:t.id, at:a.id, total:total(a) });
    audit('Admisión','Recibió tarjeta',t.id,`${a.id} · total ${total(a)} min`, SIM_USER);
  });
  const disp = S.tarjetas.filter(t=>t.estado==='Disponible');
  if (disp.length < 2){ const pd = S.tarjetas.find(t=>t.estado==='Por desinfectar' && S.now - t.desde > 9*MIN); if (pd){ pd.estado='Disponible'; pd.desde=S.now; S.ops.unshift({ t:S.now, tipo:'Desinfectada', tarjeta:pd.id }); audit('Admisión','Marcó desinfectada',pd.id,'Por desinfectar → Disponible',SIM_USER); } }
  const d2 = S.tarjetas.filter(t=>t.estado==='Disponible');
  if (d2.length && rnd() < .33) entregar(d2[rint(0,d2.length-1)], SIM_USER);
  activas().forEach(a=>{ if (['z-adm','z-sala'].includes(zonaActual(a)) && esperaCorriendo(a) > 45) alerta('media', `Espera de ${a.id} supera 45 min`, 'Sala de espera · Piso 1', 'gemelo'); });
  const sala = pisoById('p1').zonas[1]; if (enZona(sala).length > sala.aforo) alerta('alta','Aforo superado en Sala de espera',`${enZona(sala).length}/${sala.aforo}`,'gemelo');
  S.nodos.forEach(n=>{ if (n.estado==='En línea') n.latido = Date.now(); });
  S.ops = S.ops.slice(0,12);
  render(true);
}
function entregar(t, who){
  const id = 'A-0' + (S.nextId++);
  const a = { id, tarjetaId:t.id, inicio:S.now, fin:null, estado:'activa', motivo:null, destino: rnd()<.45?'piloto':'otro', pisoId:'p1',
              eventos:[{ zonaId:'z-adm', entrada:S.now, salida:null }], wObj:rint(14,40), dCons:rint(10,17), flash:true };
  S.atenciones.push(a); t.estado='En uso'; t.atencionId=id; t.desde=S.now;
  S.ops.unshift({ t:S.now, tipo:'Entregada', tarjeta:t.id, at:id });
  audit('Admisión','Entregó tarjeta',t.id,id, who);
  return a;
}

/* =========================================================
   Gemelo: render isométrico (SVG) y 2D

const C30 = Math.cos(Math.PI/6), WALL = 1.5;
function rotP(x, y, r, W, D){ return r===0?[x,y]: r===1?[D-y,x]: r===2?[W-x,D-y]: [y,W-x]; }
function rects(p, zonas){ return zonas.map(z=>({x:z.x,y:z.y,w:z.w,h:z.h})).concat((p.ambientes||[]).map(a=>({x:a.x,y:a.y,w:a.w,h:a.h}))); }
function wallSegs(p, zonas){
  const segs = new Map();
  const add = (x1,y1,x2,y2) => { const k = [x1,y1,x2,y2].map(v=>v.toFixed(2)).join(); const k2 = [x2,y2,x1,y1].map(v=>v.toFixed(2)).join(); if (!segs.has(k) && !segs.has(k2)) segs.set(k,[x1,y1,x2,y2]); };
  rects(p, zonas).forEach(r=>{ add(r.x,r.y,r.x+r.w,r.y); add(r.x+r.w,r.y,r.x+r.w,r.y+r.h); add(r.x+r.w,r.y+r.h,r.x,r.y+r.h); add(r.x,r.y+r.h,r.x,r.y); });
  return [...segs.values()];
}
function isoSVG(pisos, opts={}){
  const s = opts.s || 22, rot = opts.rot || 0, mini = !!opts.mini, gap = opts.gap || 6.5;
  const layers = pisos.map((p,i)=>({ p, zonas: opts.zonas || p.zonas, zOff: i*gap }));
  const pts = []; let out = '';
  const pr = (p, x, y, z) => { const [a,b] = rotP(x,y,rot,p.ancho,p.fondo); const X = (a-b)*C30*s, Y = ((a+b)*.5 - z)*s; pts.push([X,Y]); return [X,Y]; };
  const poly = (arr) => arr.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
  layers.forEach(({p, zonas, zOff}) => {
    const W = p.ancho, D = p.fondo, z0 = zOff;
    const dimA = rot%2 ? D : W, dimB = rot%2 ? W : D;
    const prR = (a,b,z) => { const X=(a-b)*C30*s, Y=((a+b)*.5 - z)*s; pts.push([X,Y]); return [X,Y]; };
    const multi = layers.length > 1;
    out += `<g ${multi && opts.clickPiso ? `data-a="pisoStack" data-piso="${p.id}" style="cursor:pointer"` : ''}>`;
    // losa
    out += `<polygon points="${poly([prR(dimA,0,z0),prR(dimA,dimB,z0),prR(dimA,dimB,z0-.45),prR(dimA,0,z0-.45)])}" fill="#D9D1C8"/>`;
    out += `<polygon points="${poly([prR(0,dimB,z0),prR(dimA,dimB,z0),prR(dimA,dimB,z0-.45),prR(0,dimB,z0-.45)])}" fill="#CBC2B8"/>`;
    out += `<polygon points="${poly([prR(0,0,z0),prR(dimA,0,z0),prR(dimA,dimB,z0),prR(0,dimB,z0)])}" fill="#F3EFEA" stroke="#E2DAD1"/>`;
    // pisos de zona
    zonas.forEach(z=>{
      const lv = mini && !opts.live ? 'neutral' : nivel(z);
      const fill = mini && !opts.live ? ({Ingreso:'#E5EAF2',Espera:'#E3F1E9',Servicio:'#F8E6E2',Tránsito:'#EEE9E3',Salida:'#ECE6F3'}[z.tipo]||'#EEE9E3') : SOFT[lv];
      const c = [[z.x,z.y],[z.x+z.w,z.y],[z.x+z.w,z.y+z.h],[z.x,z.y+z.h]].map(([x,y])=>pr(p,x,y,z0+.02));
      out += `<g class="${mini?'':'zone-g'}" ${mini?'':`data-zona="${z.id}" data-a="zona"`}><polygon class="zfloor" points="${poly(c)}" fill="${fill}" stroke="${mini?'#D6CEC4':'rgba(31,27,28,.12)'}"/></g>`;
    });
    // muros (orden por profundidad)
    const segs = wallSegs(p, zonas).map(([x1,y1,x2,y2])=>{ const [a1,b1]=rotP(x1,y1,rot,W,D), [a2,b2]=rotP(x2,y2,rot,W,D); return { x1,y1,x2,y2, d:(a1+b1+a2+b2)/2, along:Math.abs(b1-b2)<1e-6 }; }).sort((u,v)=>u.d-v.d);
    const h = mini ? WALL*.8 : WALL;
    segs.forEach(g=>{
      const q = [pr(p,g.x1,g.y1,z0),pr(p,g.x2,g.y2,z0),pr(p,g.x2,g.y2,z0+h),pr(p,g.x1,g.y1,z0+h)];
      out += `<polygon points="${poly(q)}" fill="${g.along?'#FFFFFF':'#F1ECE6'}" stroke="#D8CFC5" stroke-width="1" stroke-linejoin="round" pointer-events="none"/>`;
    });
    // nodos
    if (!mini) S.nodos.filter(n=>n.pisoId===p.id && n.estado!=='Baja' && zonas.some(z=>z.id===n.zonaId)).forEach(n=>{
      const [X,Y] = pr(p,n.x,n.y,z0+h+.15);
      out += `<g pointer-events="none"><circle cx="${X}" cy="${Y}" r="5.5" fill="#fff" stroke="${n.estado==='En línea'?'#2E9E6B':'#9A9294'}" stroke-width="2.5"/><text x="${X+9}" y="${Y+4}" font-size="10" font-weight="700" fill="#6E6668" font-family="Nunito Sans, sans-serif">${n.id}</text></g>`;
    });
    // íconos por zona
    if (!mini || opts.live) zonas.forEach(z=>{
      const lv = nivel(z); if (lv==='neutral') return;
      const [X,Y] = pr(p, z.x+z.w/2, z.y+z.h/2, z0 + (mini?1.6:h+1.6));
      const [FX,FY] = pr(p, z.x+z.w/2, z.y+z.h/2, z0);
      const col = COL[lv], n = enZona(z).length;
      const txt = lv==='nd' ? 'Sin datos' : lv==='pausa' ? 'Pausado' : `${n}/${z.aforo}`;
      const sc = mini ? .7 : 1;
      out += `<g class="${mini?'':'zone-g'}" ${mini?'':`data-zona="${z.id}" data-a="zona"`} transform="translate(${X.toFixed(1)} ${Y.toFixed(1)}) scale(${sc})">
        <line x1="0" y1="16" x2="0" y2="${(FY-Y)/sc - 2}" stroke="${col}" stroke-width="1.5" stroke-dasharray="2 3" opacity=".7"/>
        <circle r="16" fill="#fff" stroke="${col}" stroke-width="3.5"/>
        <g transform="translate(-9 -10) scale(.75)" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="7" r="4" fill="${col}"/><path d="M5 22v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2" fill="${col}"/></g>
        <g transform="translate(0 30)"><rect x="${-(txt.length*3.6+10)}" y="-11" width="${txt.length*7.2+20}" height="21" rx="10.5" fill="${lv==='nd'||lv==='pausa'?'#6E6668':'#1A1A1A'}"/><text y="4" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" font-family="Nunito, sans-serif">${txt}</text></g>
        ${mini?'':`<text y="-24" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1F1B1C" font-family="Nunito Sans, sans-serif" paint-order="stroke" stroke="#F7F4EF" stroke-width="4">${esc(z.nombre)}</text>`}
      </g>`;
    });
    if (multi){ const [X,Y] = prR(0,dimB,z0); out += `<text x="${X-8}" y="${Y+4}" text-anchor="end" font-size="13" font-weight="800" fill="#1F1B1C" font-family="Nunito, sans-serif">${esc(p.nombre)}</text>`; }
    out += `</g>`;
  });
  const xs = pts.map(q=>q[0]), ys = pts.map(q=>q[1]);
  const pad = mini ? 10 : 30, x0 = Math.min(...xs)-pad-(layers.length>1?60:0), y0 = Math.min(...ys)-pad-(mini?0:30), w = Math.max(...xs)-x0+pad, hh = Math.max(...ys)-y0+pad;
  return `<svg viewBox="${x0.toFixed(0)} ${y0.toFixed(0)} ${w.toFixed(0)} ${hh.toFixed(0)}" role="img" aria-label="Gemelo digital en 3D">${out}</svg>`;
}
function planSVG(p){
  const K = 30, W = p.ancho*K, D = p.fondo*K; let out = `<rect width="${W}" height="${D}" fill="#F3EFEA"/>`;
  p.zonas.forEach(z=>{ const lv = nivel(z); out += `<g class="zone-g" data-zona="${z.id}" data-a="zona"><rect class="zfloor" x="${z.x*K}" y="${z.y*K}" width="${z.w*K}" height="${z.h*K}" fill="${SOFT[lv]}"/></g>`; });
  (p.ambientes||[]).forEach(a=>{ out += `<rect x="${a.x*K}" y="${a.y*K}" width="${a.w*K}" height="${a.h*K}" fill="#ECE7E1"/><text x="${(a.x+a.w/2)*K}" y="${(a.y+a.h/2)*K+4}" text-anchor="middle" font-size="12" fill="#9A9294" font-family="Nunito Sans, sans-serif">${esc(a.nombre)}</text>`; });

  S.nodos.filter(n=>n.pisoId===p.id && n.estado!=='Baja').forEach(n=>{ out += `<g pointer-events="none"><circle cx="${n.x*K}" cy="${n.y*K}" r="6" fill="#fff" stroke="${n.estado==='En línea'?'#2E9E6B':'#9A9294'}" stroke-width="3"/><text x="${n.x*K+10}" y="${n.y*K+4}" font-size="11" font-weight="700" fill="#6E6668" font-family="Nunito Sans, sans-serif">${n.id}</text></g>`; });
  p.zonas.forEach(z=>{
    const lv = nivel(z), cx = (z.x+z.w/2)*K, cy = (z.y+z.h/2)*K;
    out += `<text x="${z.x*K+10}" y="${z.y*K+20}" font-size="13" font-weight="800" fill="#1F1B1C" font-family="Nunito, sans-serif" pointer-events="none">${esc(z.nombre)}</text>`;
    if (lv==='neutral') return;
    const col = COL[lv], txt = lv==='nd'?'Sin datos':lv==='pausa'?'Pausado':`${enZona(z).length}/${z.aforo}`;
    out += `<g class="zone-g" data-zona="${z.id}" data-a="zona" transform="translate(${cx} ${cy-8})"><circle r="17" fill="#fff" stroke="${col}" stroke-width="3.5"/><g transform="translate(-9 -10) scale(.75)" fill="${col}" stroke="${col}" stroke-width="2.6"><circle cx="12" cy="7" r="4"/><path d="M5 22v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/></g><g transform="translate(0 32)"><rect x="${-(txt.length*3.6+10)}" y="-11" width="${txt.length*7.2+20}" height="21" rx="10.5" fill="${lv==='nd'||lv==='pausa'?'#6E6668':'#1A1A1A'}"/><text y="4" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" font-family="Nunito, sans-serif">${txt}</text></g></g>`;
  });
  return `<svg viewBox="-10 -10 ${W+20} ${D+20}" role="img" aria-label="Plano 2D">${out}</svg>`;
}

function kpis(){
  const ayer = S.hist.filter(a=>a.inicio >= T0-DAY && a.inicio < T0);
  const hoyAt = S.atenciones;
  const espH = avg(hoyAt.map(espera)), espA = avg(ayer.map(espera));
  const conH = avg(hoyAt.map(consulta)), conA = avg(ayer.map(consulta));
  const sala = pisoById('p1').zonas.find(z=>z.tipo==='Espera');
  const cmp = (h,a) => h==null||a==null ? '' : h===a ? 'igual que ayer' : `${h<a?'▼':'▲'} ${Math.abs(h-a)} min vs. ayer (${a} min)`;
  return `<div class="kpis">
    <div class="card kpi"><span class="k">En la clínica</span><span class="v num">${activas().length}</span><span class="c">${S.atenciones.filter(a=>a.estado==='cerrada').length} atendidos hoy</span></div>
    <div class="card kpi"><span class="k">En sala de espera</span><span class="v num">${enZona(sala).length}<small>/${sala.aforo}</small></span><span class="c"><span class="dot ${nivel(sala)==='pausa'?'nd':nivel(sala)}"></span> Concentración ${NIV[nivel(sala)].toLowerCase()}</span></div>
    <div class="card kpi"><span class="k">Espera promedio hoy</span><span class="v num">${espH??'—'}<small> min</small></span><span class="c">${cmp(espH,espA)}</span></div>
    <div class="card kpi"><span class="k">Consulta promedio hoy</span><span class="v num">${conH??'—'}<small> min</small></span><span class="c">${cmp(conH,conA)}</span></div>
  </div>`;
}

/* ---- Historial ---- */
function rangoDias(){
  if (S.ui.hRango==='hoy') return [T0, T0+DAY];
  if (S.ui.hRango==='custom' && S.ui.hDesde && S.ui.hHasta){ const a = new Date(S.ui.hDesde+'T00:00').getTime(), b = new Date(S.ui.hHasta+'T00:00').getTime()+DAY; return [Math.min(a,b), Math.max(a,b)]; }
  return [T0-6*DAY, T0+DAY];
}
function histRows(){
  const [a,b] = rangoDias();
  if (S.ui.hPiso!=='p1') return [];
  let rows = S.hist.concat(S.atenciones).filter(x=>x.inicio>=a && x.inicio<b);
  if (S.ui.hZona) rows = rows.filter(x=>x.eventos.some(e=>e.zonaId===S.ui.hZona));
  if (S.ui.hQ) rows = rows.filter(x=>x.id.toLowerCase().includes(S.ui.hQ.toLowerCase().trim()));
  return rows.sort((x,y)=>y.inicio-x.inicio);
}

      ${rows.slice(S.ui.hPage*per, S.ui.hPage*per+per).map(a=>`<tr class="click" data-a="verAt" data-id="${a.id}" data-from="historial"><td class="mono">${a.id}</td><td>${fecha(a.inicio)}</td><td class="num">${hhmm(a.inicio)}</td><td>${a.destino==='piloto'?'Consultorio piloto':'Otro consultorio'}</td><td class="num">${dur(espera(a))}</td><td class="num">${dur(consulta(a))}</td><td class="num">${a.estado==='activa'?'<span class="chip media">En curso</span>':dur(total(a))}</td><td>${a.estado==='activa'?'—':esc(a.motivo)}</td></tr>`).join('') || `<tr><td colspan="8"><div class="empty">No hay atenciones con estos filtros.</div></td></tr>`}

  </section>`;
}
function occSeries(zid){
  const [a,b] = rangoDias(); const series = S.occ[zid]; if (!series) return null;
  const days = []; for (let d=0; d<7; d++){ const t = T0 - (6-d)*DAY; if (t>=a && t<b) days.push(series[d]); }
  if (!days.length) return Array(12).fill(0);
  return Array.from({length:12},(_,h)=>Math.round(days.reduce((s,r)=>s+r[h],0)/days.length*10)/10).map((v,h)=>{ if (b>T0 && a>=T0 && h+7 > new Date(S.now).getHours()) return null; return v; });
}
function aforoChart(z){
  const v = occSeries(z.id); const maxv = Math.max(...S.occ[z.id].flat());
  const W = 620, H = 230, L = 34, R = 10, Tp = 12, B = 28, top = Math.max(z.aforo, Math.ceil(Math.max(...v.filter(x=>x!=null), 1)))*1.15;
  const x = i => L + i*(W-L-R)/11, y = val => Tp + (H-Tp-B)*(1 - val/top);
  const pts = v.map((val,i)=>val==null?null:[x(i),y(val)]).filter(Boolean);
  const ticks = [0, Math.round(top/3), Math.round(2*top/3)];
  const grid = ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="#EFEAE3"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join('');
  const area = pts.length ? `<path d="M${pts[0][0]},${y(0)} ${pts.map(p=>`L${p[0]},${p[1]}`).join(' ')} L${pts[pts.length-1][0]},${y(0)} Z" fill="rgba(166,4,55,.08)"/><path d="${pts.map((p,i)=>`${i?'L':'M'}${p[0]},${p[1]}`).join(' ')}" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>` : '';
  const dots = v.map((val,i)=>val==null?'':`<circle cx="${x(i)}" cy="${y(val)}" r="${val>z.aforo?5:3.2}" fill="${val>z.aforo?'#E53935':'#1A1A1A'}"><title>${pad2(i+7)}:00 · ${val} pacientes</title></circle>`).join('');
  const xl = v.map((_,i)=>i%2===0?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${pad2(i+7)}:00</text>`:'').join('');
  const lim = `<line x1="${L}" x2="${W-R}" y1="${y(z.aforo)}" y2="${y(z.aforo)}" stroke="#E53935" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-R}" y="${y(z.aforo)-6}" text-anchor="end" style="fill:#B3261E;font-weight:700">Aforo ${z.aforo}</text>`;
  const peakI = v.reduce((m,val,i)=>val!=null&&(m<0||val>v[m])?i:m,-1);
  const peak = peakI>=0?`<text x="${x(peakI)}" y="${y(v[peakI])-10}" text-anchor="middle" style="fill:#1F1B1C;font-weight:800">${v[peakI]}</text>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Aforo histórico">${grid}${area}${lim}${dots}${peak}${xl}</svg>
  <p class="hint" style="margin:6px 0 0">Hora pico: <b>${peakI>=0?pad2(peakI+7)+':00':'—'}</b>. Máximo registrado en 7 días: <b>${maxv}</b> pacientes${maxv>z.aforo?' (superó el aforo)':''}.</p>`;
}
function heatmap(z){
  const s = S.occ[z.id]; const cols = 12;
  let h = `<div class="hm" style="grid-template-columns:54px repeat(${cols},minmax(0,1fr))"><span></span>${Array.from({length:cols},(_,i)=>`<span class="lab" style="justify-content:center">${i%2===0?pad2(i+7):''}</span>`).join('')}`;
  s.forEach((row,d)=>{
    const t = T0-(6-d)*DAY;
    h += `<span class="lab">${DIAS[new Date(t).getDay()]} ${new Date(t).getDate()}</span>`;
    row.forEach((v,i)=>{
      const fut = d===6 && i+7 > new Date(S.now).getHours();
      const pct = Math.round(v/z.aforo*100), lv = pct>z.umb[1]?'alta':pct>z.umb[0]?'media':'baja';
      const op = .18 + Math.min(1, pct/110)*.82;
      h += fut ? `<span class="c" style="background:#F4F1ED"></span>` : `<span class="c" title="${DIAS[new Date(t).getDay()]} ${pad2(i+7)}:00 · ${v} pacientes (${pct} %)" style="background:${COL[lv]};opacity:${op.toFixed(2)};color:${op>.6?'#fff':'#1F1B1C'}">${pct}</span>`;
    });
  });
  return h + `</div>`;
}

            ${nodosPiso.map(n=>`<span class="t-z" style="cursor:default">${ic('radio','')}${n.id}</span>`).join('').replace(/<svg /g,'<svg width="13" height="13" ')}</div>`:''}`).join('')}

function edSVG(p){
  const K = 30, W = p.ancho*K, D = p.fondo*K, zs = borr(p);
  let out = `<defs><pattern id="grid" width="${K}" height="${K}" patternUnits="userSpaceOnUse"><path d="M${K} 0H0V${K}" fill="none" stroke="#F0EBE5"/></pattern></defs><rect width="${W}" height="${D}" fill="url(#grid)" data-bg="1"/>`;
  if (p.plano) out += `<image href="${p.plano}" x="0" y="0" width="${W}" height="${D}" preserveAspectRatio="none" opacity=".55" pointer-events="none"/>`;
  else { (p.ambientes||[]).forEach(a=>{ out += `<rect x="${a.x*K}" y="${a.y*K}" width="${a.w*K}" height="${a.h*K}" fill="none" stroke="#C9C0B6" stroke-width="2" pointer-events="none"/><text x="${(a.x+a.w/2)*K}" y="${(a.y+a.h/2)*K}" text-anchor="middle" font-size="12" fill="#9A9294" pointer-events="none">${esc(a.nombre)}</text>`; });
    p.zonas.forEach(z=>{ out += `<rect x="${z.x*K}" y="${z.y*K}" width="${z.w*K}" height="${z.h*K}" fill="none" stroke="#C9C0B6" stroke-width="2" pointer-events="none"/>`; }); }
  zs.forEach(z=>{
    const sel = z.id===S.ed.sel;
    out += `<g data-ez="${z.id}" style="cursor:${S.ed.tool==='sel'?'move':'crosshair'}"><rect x="${z.x*K}" y="${z.y*K}" width="${z.w*K}" height="${z.h*K}" fill="${TCOL[z.tipo]}" fill-opacity=".78" stroke="${sel?'#A60437':'#8C8486'}" stroke-width="${sel?2.5:1.2}" ${sel?'stroke-dasharray="7 5"':''}/>
      <text x="${(z.x+z.w/2)*K}" y="${(z.y+z.h/2)*K}" text-anchor="middle" font-size="14" font-weight="800" fill="${sel?'#A60437':'#3A3536'}" font-family="Nunito, sans-serif" pointer-events="none">${esc(z.nombre)}</text>
      ${z.tipo!=='Tránsito'&&z.tipo!=='Salida'?`<text x="${(z.x+z.w/2)*K}" y="${(z.y+z.h/2)*K+18}" text-anchor="middle" font-size="11.5" fill="#6E6668" pointer-events="none">Aforo ${z.aforo}</text>`:''}</g>`;
    if (sel) [['nw',z.x,z.y],['ne',z.x+z.w,z.y],['sw',z.x,z.y+z.h],['se',z.x+z.w,z.y+z.h]].forEach(([k,x,y])=>{ out += `<rect data-h="${k}" x="${x*K-6}" y="${y*K-6}" width="12" height="12" fill="#fff" stroke="#A60437" stroke-width="2" style="cursor:${k==='nw'||k==='se'?'nwse':'nesw'}-resize"/>`; });
  });
  S.nodos.filter(n=>n.pisoId===p.id && n.estado!=='Baja').forEach(n=>{ out += `<g pointer-events="none"><rect x="${n.x*K-24}" y="${n.y*K-11}" width="48" height="22" rx="11" fill="#fff" stroke="#D6CEC4"/><circle cx="${n.x*K-13}" cy="${n.y*K}" r="4" fill="${n.estado==='En línea'?'#2E9E6B':'#B0B0B0'}"/><text x="${n.x*K+3}" y="${n.y*K+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#3A3536">${n.id}</text></g>`; });
  out += `<g pointer-events="none"><line x1="10" y1="${D-12}" x2="${10+5*K}" y2="${D-12}" stroke="#3A3536" stroke-width="3"/><text x="${10+5*K+6}" y="${D-8}" font-size="11" fill="#3A3536">5 m</text></g>`;
  return `<svg id="edsvg" viewBox="0 0 ${W} ${D}" role="img" aria-label="Editor del plano">${out}</svg>`;
}

    ${S.tarjetas.map(t=>`<tr><td class="mono">${t.id}</td><td class="num">${t.ble}</td><td><span class="chip ${({'Disponible':'baja','En uso':'','Por desinfectar':'media','Sin devolver':'alta','Extraviada':'alta','Baja':'dark'})[t.estado]}">${t.estado}</span></td><td class="num">${t.estado==='En uso'?t.atencionId:'—'}</td><td class="num">${t.desde?hhmm(t.desde):'—'}</td><td style="text-align:right">${t.estado!=='Baja'&&t.estado!=='En uso'?`<button class="btn btn-g btn-sm" data-a="tarjetaBaja" data-t="${t.id}">Dar de baja</button>`:''}</td></tr>`).join('')}

/* ---- Auditoría ---- */

/* =========================================================
   Shell, modales y render

const MENU = {
  Operador:[['admision','scan','Admisión'],['gemelo','cube','Gemelo en vivo'],['historial','chart','Historial y reportes'],['seguimiento','pulse','Seguimiento']],
  Gerencia:[['gemelo','cube','Gemelo en vivo'],['historial','chart','Historial y reportes']],
  Administrador:[['gemelo','cube','Gemelo en vivo'],['historial','chart','Historial y reportes'],['construccion','ruler','Construcción del gemelo'],['dispositivos','cpu','Dispositivos'],['usuarios','users','Usuarios'],['auditoria','list','Auditoría']]
};
const TITLES = { admision:'Admisión', gemelo:'Gemelo en vivo', historial:'Historial y reportes', atencion:'Detalle de atención', seguimiento:'Seguimiento', construccion:'Construcción del gemelo', dispositivos:'Dispositivos', usuarios:'Usuarios', auditoria:'Auditoría', cambiar:'Cambiar contraseña' };
const home = () => S.user.rol==='Operador' ? 'admision' : 'gemelo';
function shell(inner){
  const u = S.user, nAl = S.alertas.filter(a=>!a.leida).length;
  const pisoTxt = S.route==='gemelo' ? (S.ui.piso==='todos'?'Todos los pisos':pisoById(S.ui.piso)?.nombre) : S.route==='construccion' ? pisoById(S.ed.pisoId)?.nombre : 'Piso 1';
  return `<div class="app">
    <aside class="side">
      <div class="brand">${logo()}<small>Clínica Renal y Oncológica</small></div>
      <nav class="nav" aria-label="Menú principal">${MENU[u.rol].map(([r,i,t])=>`<a href="#${r}" class="${S.route===r||(S.route==='atencion'&&r===(S.ui.from==='historial'?'historial':'gemelo'))?'on':''}">${ic(i)}<span>${t}</span></a>`).join('')}</nav>
      <div class="me"><b>${esc(u.nombre)}</b><span>${u.rol} · ${esc(u.correo)}</span><button data-a="logout">${ic('out')} Cerrar sesión</button></div>
    </aside>
    <div class="main">
      <header class="top">
        <div class="crumbs">${esc(S.sedes[0].nombre)} › ${esc(pisoTxt||'')} › <b>${TITLES[S.route]||''}</b></div>
        <span class="sp"></span>
        ${u.rol==='Gerencia'?'<span class="ro">Modo: Solo lectura</span>':''}
        <span class="live ${S.simOn?'':'off'}"><i></i>${S.simOn?'En vivo':'En pausa'} · <span class="num">${hhmm(S.now)}</span></span>
        <div style="position:relative"><button class="iconbtn" data-a="bell" aria-label="Alertas">${ic('bell')}${nAl?`<span class="badge num">${nAl}</span>`:''}</button>
          ${S.ui.bell?`<div class="dd"><div style="padding:6px 10px 8px;font-weight:800;font-family:var(--f-disp)">Alertas</div>${S.alertas.slice(0,8).map(a=>`<button class="dd-item" data-a="alertaIr" data-r="${a.ir}"><span class="dot ${a.tipo}"></span><span><b>${esc(a.txt)}</b><br><span class="hint">${esc(a.det)} · ${hhmm(a.t)}</span></span></button>`).join('')||'<div class="hint" style="padding:10px">Sin alertas.</div>'}</div>`:''}</div>
        <div style="position:relative"><button class="usr" data-a="umenu"><span class="av">${u.nombre.split(' ').map(x=>x[0]).join('').slice(0,2)}</span><span>${esc(u.nombre.split(' ')[0])}<small>${u.rol}</small></span></button>
          ${S.ui.menu?`<div class="dd" style="width:220px"><button class="dd-item" data-a="nav" data-r="cambiar">${ic('lock').replace('<svg ','<svg width="16" height="16" ')} Cambiar contraseña</button><button class="dd-item" data-a="logout">${ic('out').replace('<svg ','<svg width="16" height="16" ')} Cerrar sesión</button></div>`:''}</div>
      </header>
      <main class="content" id="view">${inner}</main>
      <footer class="demo-foot">Prototipo con datos simulados · cada 8 s pasan 3 minutos en la clínica. <button class="btn btn-o btn-sm" data-a="sim">${S.simOn?ic('pause')+' Pausar simulación':ic('play')+' Reanudar simulación'}</button></footer>
    </div>
  </div>`;
}
function viewFor(r){
  if (!can(r)) return `<div class="denied card pad">${ic('lock').replace('<svg ','<svg width="34" height="34" ')}<h2>No tienes permiso para ver esta sección</h2><p class="hint">Tu rol (${S.user.rol}) no incluye esta pantalla.</p><button class="btn btn-n" data-a="home">Ir a mi inicio</button></div>`;
  return ({ admision:viewAdmision, gemelo:viewGemelo, historial:viewHistorial, atencion:viewAtencion, seguimiento:viewSeguimiento, construccion:viewConstruccion, dispositivos:viewDispositivos, usuarios:viewUsuarios, auditoria:viewAuditoria, cambiar:viewCambiar }[r] || viewGemelo)();
}
function render(fromTick){
  if (fromTick && (S.ed.drag || S.ui.modal && S.ui.modal.noTick)) return;
  const act = document.activeElement, aid = act && act.id, sel = act && 'selectionStart' in act ? [act.selectionStart, act.selectionEnd] : null;
  const vals = {}; document.querySelectorAll('#root input[id], #root select[id]').forEach(el=>{ if (el.type!=='password' && el.type!=='file') vals[el.id] = el.value; });
  const sx = window.scrollX, sy = window.scrollY;
  if (!S.user) $('#root').innerHTML = viewLogin();
  else if (S.user.estado==='Primer ingreso') { S.route = 'cambiar'; $('#root').innerHTML = shell(viewCambiar()); }
  else $('#root').innerHTML = shell(viewFor(S.route));
  if (fromTick) for (const id in vals){ const el = document.getElementById(id); if (el && (el.tagName==='INPUT' || el.tagName==='SELECT')) el.value = vals[id]; }
  if (aid){ const el = document.getElementById(aid); if (el){ el.focus({preventScroll:true}); if (sel && el.setSelectionRange) try{ el.setSelectionRange(sel[0], sel[1]); }catch(e){} } }
  else if (S.route==='admision' && !S.ui.modal && !fromTick) $('#scan')?.focus({preventScroll:true});
  window.scrollTo(sx, sy);
  if (!fromTick) renderModal();
}

/* ---- Modales ---- */
function renderModal(){
  const m = S.ui.modal, root = $('#modal');
  if (!m){ root.innerHTML = ''; return; }
  const act = document.activeElement, aid = act && act.id;
  const vals = {}; root.querySelectorAll('input[id],select[id]').forEach(el=>{ if (el.type!=='file') vals[el.id] = el.value; });
  const M = (title, body, foot, wide) => `<div class="scrim" data-a="scrim"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="m-h"><h2>${esc(title)}</h2><button class="x" data-a="close" aria-label="Cerrar">${ic('x')}</button></div><div class="m-b">${body}</div><div class="m-f">${foot}</div></div></div>`;
  let h = '';
  if (m.type==='zona'){
    const z = zonaById(m.z), lv = nivel(z), n = nodoDeZona(z), at = enZona(z);
    const espZ = avg(S.atenciones.map(a=>{ const e = a.eventos.find(e=>e.zonaId===z.id); return e ? mins((e.salida||S.now)-e.entrada) : null; }));
    h = `<div class="scrim drawer-scrim" data-a="scrim"><aside class="drawer" role="dialog" aria-label="Detalle de zona"><div class="m-h"><div><span class="lbl-up">${z.tipo}</span><h2 style="font-size:22px">${esc(z.nombre)}</h2></div><button class="x" data-a="close" aria-label="Cerrar">${ic('x')}</button></div>
      <div class="m-b">
        <div style="display:flex;gap:10px;align-items:center"><span class="tag-id num" style="font-size:40px">${lv==='nd'?'—':at.length}<small style="font-size:18px;color:var(--gris)">/${z.aforo}</small></span><span class="chip ${lv==='pausa'?'nd':lv}">${NIV[lv]}</span></div>
        <div class="tiles"><div class="tile t2"><b class="num">${espZ??'—'}<small style="font-size:13px"> min</small></b><span>Permanencia promedio hoy</span></div><div class="tile t2"><b style="font-size:16px">${n?n.id:'—'}</b><span>${n?n.estado:'Nodo no instalado'}</span></div></div>
        ${z.pausa?`<div class="helpbox">Seguimiento pausado por ${esc(z.pausa.por)} a las ${hhmm(z.pausa.t)} · ${esc(z.pausa.motivo)}</div>`:''}
        <h3>Atenciones en la zona</h3>
        <div class="list">${at.length?at.map(a=>`<button class="fc" data-a="verAt" data-id="${a.id}" data-from="gemelo"><span class="mid"><b>${a.id}</b><p>en la zona hace ${mins(S.now-a.eventos[a.eventos.length-1].entrada)} min</p></span><span class="chip">${a.tarjetaId}</span></button>`).join(''):'<div class="empty">No hay pacientes en esta zona.</div>'}</div>
      </div></aside></div>`;
  }
  if (m.type==='pausar'){
    const z = zonaById(m.z);
    h = M(`Pausar ${z.nombre}`, `<p style="margin:0">Mientras esté pausada, la zona se verá en gris en el gemelo y sus minutos no contarán en las métricas.</p>
      <div class="field"><label>Motivo</label><div class="chips">${['Limpieza','Mantenimiento','Sin atención','Otro'].map(x=>`<button class="chipbtn ${m.motivo===x?'on':''}" data-a="motivo" data-v="${x}">${x}</button>`).join('')}</div></div>`,
      `<button class="btn btn-o" data-a="close">Cancelar</button><button class="btn btn-p" data-a="confPausa" ${m.motivo?'':'disabled'}>Pausar seguimiento</button>`);
  }
  if (m.type==='confirm'){
    h = M(m.title, `<p style="margin:0">${m.body}</p>`, `<button class="btn btn-o" data-a="close">Cancelar</button><button class="btn ${m.danger?'btn-n':'btn-p'}" data-a="confirmOk">${esc(m.ok)}</button>`);
  }
  if (m.type==='sede'){
    h = M('Nueva sede', `<form id="f-sede" data-f="sede" style="display:flex;flex-direction:column;gap:12px"><div class="field"><label for="sd-n">Nombre</label><input class="inp" id="sd-n" name="n" required placeholder="Clínica CREO+ – Sede Norte"></div><div class="field"><label for="sd-d">Dirección</label><input class="inp" id="sd-d" name="d" placeholder="Av. …, Lima"></div></form>`,
      `<button class="btn btn-o" data-a="close">Cancelar</button><button class="btn btn-p" type="submit" form="f-sede">Crear sede</button>`);
  }
  if (m.type==='piso'){
    const st = m.step;
    const prog = `<div class="progress">${[1,2,3,4].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div><span class="hint">Paso ${st} de 4 · ${['Datos del piso','Plano','Escala','Listo'][st-1]}</span>`;
    let body = '', foot = '';

function doLogin(mail, pass){
  mail = (mail||'').trim().toLowerCase();
  const f = S.loginFails[mail] || { n:0, until:0 };
  if (f.until > Date.now()){ S.ui.loginErr = 'Cuenta bloqueada 5 min por demasiados intentos. Pide ayuda al Administrador.'; return render(); }
  const u = S.usuarios.find(x=>x.correo===mail);
  if (!u || u.pass!==pass){ f.n++; if (f.n>=5){ f.until = Date.now()+5*MIN; f.n = 0; } S.loginFails[mail] = f; S.ui.loginErr = f.until>Date.now() ? 'Cuenta bloqueada 5 min por demasiados intentos.' : `Correo o contraseña incorrectos. Intento ${f.n} de 5.`; return render(); }
  if (u.estado==='Desactivado'){ S.ui.loginErr = 'Esta cuenta está desactivada. Pide ayuda al Administrador.'; return render(); }
  S.loginFails[mail] = { n:0, until:0 }; S.ui.loginErr = ''; S.ui.olvido = false;
  S.user = u; u.ultimo = S.now; audit('Sesión','Inició sesión','—','Navegador web');
  S.ui.piso = visiblePisos()[0]?.id || 'p1'; S.ui.hPiso = S.ui.piso;
  const r = u.estado==='Primer ingreso' ? 'cambiar' : home();
  if (location.hash.slice(1)===r) { S.route = r; render(); } else go(r);
}
function scanCode(raw){
  const m = String(raw||'').trim().toUpperCase().match(/^T?-?\s*(\d{1,3})$/);
  const code = m ? 'T-' + pad2(+m[1]) : String(raw||'').trim().toUpperCase();
  const t = S.tarjetas.find(x=>x.id===code), modo = S.ui.admModo;
  const before = { tarjetas:clone(S.tarjetas), atenciones:clone(S.atenciones), ops:clone(S.ops), nextId:S.nextId, aud:S.auditoria.length };
  let res;
  if (!code) return;
  if (!t) res = { kind:'error', html:`<b style="font-size:18px">Tarjeta ${esc(code)} no registrada</b><span>Pide al Administrador que la registre en Dispositivos.</span>` };
  else if (t.estado==='Baja') res = { kind:'error', html:`<b style="font-size:18px">La tarjeta ${t.id} está dada de baja</b><span>Use otra tarjeta disponible.</span>` };
  else if (t.estado==='Por desinfectar') res = { kind:'error', html:`<b style="font-size:18px">Esta tarjeta aún no está desinfectada</b><span>${t.id} se devolvió a las ${hhmm(t.desde)}. Desinféctela con alcohol al 70% antes de entregarla.</span><div class="row"><button class="btn btn-n btn-sm" data-a="desinfectar" data-t="${t.id}">${ic('check')} Marcar desinfectada</button></div>` };
  else if (t.estado==='Sin devolver' || t.estado==='Extraviada'){ t.estado='Por desinfectar'; t.desde=S.now; t.atencionId=null; S.ops.unshift({t:S.now,tipo:'Recuperada',tarjeta:t.id}); audit('Admisión','Recuperó tarjeta',t.id,'→ Por desinfectar'); S.alertas.forEach(a=>{ if (a.txt.includes(t.id)) a.leida = true; }); res = { kind:'info', html:`<b style="font-size:18px">Tarjeta ${t.id} recuperada</b><span>Pasa a «Por desinfectar». Desinféctela antes de volver a entregarla.</span>` }; }
  else if (t.estado==='Disponible'){
    if (modo==='recibir') res = { kind:'error', html:`<b style="font-size:18px">${t.id} no está en uso</b><span>Esta tarjeta está disponible: no hay nada que recibir. Para entregarla, vuelva al modo automático.</span>` };
    else { const a = entregar(t); res = { kind:'ok', html:`<span class="lbl-up" style="color:#1E6E4A">Tarjeta ${t.id} entregada · ${hhmm(S.now)}</span><span class="big">${a.id}</span><span>Lea el código en voz alta al paciente. El recorrido y el tiempo de espera ya empezaron.</span>` }; }
  }
  else if (t.estado==='En uso'){
    if (modo==='entregar') res = { kind:'error', html:`<b style="font-size:18px">${t.id} ya está en uso (${t.atencionId})</b><span>Para entregarla primero hay que recibirla. Vuelva al modo automático.</span>` };
    else {
      const a = S.atenciones.find(x=>x.id===t.atencionId); cerrar(a,'Devuelta');
      t.estado='Por desinfectar'; t.atencionId=null; t.desde=S.now;
      S.ops.unshift({ t:S.now, tipo:'Recibida', tarjeta:t.id, at:a.id, total:total(a) });
      audit('Admisión','Recibió tarjeta',t.id,`${a.id} · total ${total(a)} min`);
      res = { kind:'ok', html:`<span class="lbl-up" style="color:#1E6E4A">Tarjeta ${t.id} recibida · recorrido terminado</span><span class="big">${a.id}</span><div class="row" style="font-size:15px"><span>Espera <b>${dur(espera(a))}</b></span><span>·</span><span>Consulta <b>${dur(consulta(a))}</b></span><span>·</span><span>Total <b>${dur(total(a))}</b></span></div><span>La tarjeta pasó a «Por desinfectar».</span>` };
    }
  }
  S.ui.admRes = res;
  if (res.kind==='ok' || res.kind==='info'){ S.undo = { t:Date.now(), before }; setTimeout(()=>{ if (S.undo && Date.now()-S.undo.t>=30000){ S.undo=null; if (S.route==='admision') render(true); } }, 30100); }
  render();
  const s = $('#scan'); if (s){ s.value=''; s.focus(); }
}

  crearPiso: () => { const m = S.ui.modal; const id = 'p' + (S.pisos.length+1) + '-' + Date.now()%1000; S.pisos.push({ id, sedeId:m.sede, nombre:m.nombre, nivel:+m.nivel, ancho:+m.ancho, fondo:+m.fondo, plano:m.plano, planoNombre:m.planoNombre, publicado:false, dirty:true, ambientes:[], zonas:[], borrador:[] }); audit('Gemelo','Creó piso',m.nombre,`${m.ancho} × ${m.fondo} m · borrador`); S.ed.pisoId = id; S.ed.sel = null; S.ed.tool = 'rect'; closeModal(); toast(`${m.nombre} creado como borrador. Dibuje sus zonas.`); render(); },
  escalaOk: () => { const p = pisoById(S.ed.pisoId), m = S.ui.modal; p.ancho = +m.ancho||p.ancho; p.fondo = +m.fondo||p.fondo; p.dirty = true; audit('Gemelo','Fijó escala',p.nombre,`${p.ancho} × ${p.fondo} m`); closeModal(); render(); },
  // Dispositivos
  disTab: el => { S.ui.disTab = el.dataset.v; render(); },
  nodoNuevo: () => { const n = S.nodos.length+1; openModal({ type:'nodo', nombre:'N-'+pad2(n), mac:'', piso:'p2', zona:'z2-sala', noTick:true }); },
  nodoEditar: el => { const n = S.nodos.find(x=>x.id===el.dataset.n); openModal({ type:'nodo', edit:n.id, piso:n.pisoId, zona:n.zonaId, noTick:true }); },
  nodoBaja: el => openModal({ type:'confirm', title:`Dar de baja ${el.dataset.n}`, body:'El nodo dejará de usarse y su zona se verá «Sin datos» hasta registrar otro.', ok:'Dar de baja', danger:true, fn:()=>{ const n = S.nodos.find(x=>x.id===el.dataset.n); n.estado='Baja'; audit('Dispositivos','Dio de baja nodo',n.id,zonaById(n.zonaId)?.nombre); toast(`${n.id} dado de baja`,'warn'); } }),
  tarjetaNueva: () => openModal({ type:'tarjeta', code:'T-'+pad2(S.tarjetas.length+1), noTick:true }),
  leerBle: () => { const m = S.ui.modal; m.code = $('#tj-c')?.value || m.code; m.leyendo = true; renderModal(); setTimeout(()=>{ if (S.ui.modal===m){ m.leyendo = false; m.ble = '0x' + Math.floor(0xC0A000 + Math.random()*0xFFF).toString(16).toUpperCase(); renderModal(); } }, 1200); },
  tarjetaBaja: el => openModal({ type:'confirm', title:`Dar de baja ${el.dataset.t}`, body:'La tarjeta no podrá volver a entregarse. Úselo si está dañada o se perdió definitivamente.', ok:'Dar de baja', danger:true, fn:()=>{ const t = S.tarjetas.find(x=>x.id===el.dataset.t); t.estado='Baja'; t.desde=S.now; audit('Dispositivos','Dio de baja tarjeta',t.id,''); toast(`${t.id} dada de baja`,'warn'); } }),
  // Usuarios
  usrNuevo: () => openModal({ type:'usuario', rol:'Operador', noTick:true }),
  usrEditar: el => openModal({ type:'usuario', edit:el.dataset.u, noTick:true }),
  mrol: el => { const m = S.ui.modal; m.n = $('#us-n')?.value; m.c = $('#us-c')?.value; m.rol = el.dataset.v; renderModal(); const a = $('#us-n'), b = $('#us-c'); if (a && m.n!=null) a.value = m.n; if (b && m.c!=null) b.value = m.c; },
  usrReset: el => { const u = S.usuarios.find(x=>x.id===el.dataset.u); const pass = tempPass(); u.pass = pass; if (u.estado!=='Desactivado') u.estado = 'Primer ingreso'; audit('Usuarios','Restableció contraseña',u.nombre,'Contraseña temporal generada'); openModal({ type:'usuario', pass, nombre:u.nombre, reset:true }); render(); },
  usrToggle: el => { const u = S.usuarios.find(x=>x.id===el.dataset.u);
    if (u.estado!=='Desactivado' && u.rol==='Administrador' && S.usuarios.filter(x=>x.rol==='Administrador' && x.estado!=='Desactivado').length===1){ toast('No se puede desactivar al único Administrador activo.','bad'); return; }
    if (u.estado==='Desactivado'){ u.estado = 'Activo'; audit('Usuarios','Reactivó usuario',u.nombre,'Desactivado → Activo'); toast(`${u.nombre} reactivado`); render(); }
    else openModal({ type:'confirm', title:`Desactivar a ${u.nombre}`, body:'No podrá iniciar sesión. Sus registros se conservan en la auditoría. Puede reactivarlo cuando quiera.', ok:'Desactivar', danger:true, fn:()=>{ u.estado = 'Desactivado'; audit('Usuarios','Desactivó usuario',u.nombre,'Activo → Desactivado'); toast(`${u.nombre} desactivado`,'warn'); } }); },
  copiar: el => { const v = el.dataset.v; navigator.clipboard?.writeText(v).then(()=>toast('Contraseña copiada')).catch(()=>{ const r = document.createRange(); r.selectNodeContents($('#pwtxt')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('Seleccionada: use Ctrl+C para copiar','warn'); }); },
  // Modales
  close: () => closeModal(),
  scrim: (el, e) => { if (e.target===el) closeModal(); },
  confirmOk: () => { const fn = S.ui.modal.fn; closeModal(); fn && fn(); render(); }
};
const tempPass = () => 'Creo-' + rint(1000,9999) + 'XYZW'[rint(0,3)];
function planoEjemplo(){
  const s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390"><rect width="720" height="390" fill="#fff"/><g fill="none" stroke="#7d7470" stroke-width="5"><rect x="6" y="6" width="708" height="378"/><path d="M6 270h708M240 6v264M480 6v264M480 150h234M240 150h120"/></g><g fill="none" stroke="#bdb3ad" stroke-width="2"><path d="M300 270a30 30 0 0 1 30-30M560 150a30 30 0 0 0 30 30"/></g><g font-family="sans-serif" font-size="16" fill="#9a9294"><text x="90" y="140">Recepción</text><text x="320" y="210">Espera</text><text x="560" y="80">Tópico</text><text x="560" y="220">Consultorio</text><text x="320" y="330">Pasillo</text></g></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(s);
}

/* ---- Formularios ---- */
const F = {
  login: f => doLogin(f.mail.value, f.pass.value),
  escanear: f => scanCode(f.code.value),
  cambiar: f => {
    const u = S.user, a = f.a.value, n = f.n.value, c = f.c.value;
    if (a!==u.pass) S.ui.cpErr = 'La contraseña actual no es correcta.';
    else if (n.length<8 || !/[A-Z]/.test(n) || !/\d/.test(n)) S.ui.cpErr = 'La nueva contraseña no cumple los requisitos.';
    else if (n!==c) S.ui.cpErr = 'Las contraseñas no coinciden.';
    else { u.pass = n; const first = u.estado==='Primer ingreso'; u.estado = 'Activo'; S.ui.cpErr = ''; audit('Sesión','Cambió su contraseña','—',first?'Primer ingreso':''); toast('Contraseña actualizada'); go(home()); S.route = home(); render(); return; }
    render();
  },
  sede: f => { const n = f.n.value.trim(); if (!n) return; S.sedes.push({ id:'s'+(S.sedes.length+1), nombre:n, direccion:f.d.value }); audit('Gemelo','Creó sede',n,f.d.value||''); closeModal(); toast(`Sede «${n}» creada. Agregue su primer piso.`); render(); },
  nodo: f => {
    const m = S.ui.modal, zona = f.z.value, piso = $('#nd-p').value;
    if (m.edit){ const n = S.nodos.find(x=>x.id===m.edit); const z = zonaById(zona); n.zonaId = zona; n.pisoId = piso; n.x = z.x + z.w/2; n.y = z.y + 1.2; audit('Dispositivos','Cambió zona de nodo',n.id,z.nombre); closeModal(); toast(`${n.id} ahora cubre ${z.nombre}`); render(); return; }
    const nom = f.n.value.trim().toUpperCase(), mac = f.m.value.trim().toUpperCase();
    if (S.nodos.some(x=>x.id===nom)){ m.err = `Ya existe un nodo llamado ${nom}.`; m.nombre = nom; m.mac = mac; renderModal(); return; }
    if (!/^([0-9A-F]{2}:){5}[0-9A-F]{2}$/.test(mac)){ m.err = 'La MAC debe tener el formato 24:6F:28:AA:01:04.'; m.nombre = nom; m.mac = mac; renderModal(); return; }
    const z = zonaById(zona); const n = { id:nom, mac, pisoId:piso, zonaId:zona, x:z.x+z.w/2, y:z.y+1.2, estado:'Esperando primera señal', latido:Date.now() };
    S.nodos.push(n); audit('Dispositivos','Registró nodo',nom,`${pisoById(piso).nombre} · ${z.nombre}`); closeModal(); toast(`${nom} registrado. Esperando su primera señal…`); render();
    setTimeout(()=>{ n.estado = 'En línea'; n.latido = Date.now(); toast(`${nom} en línea · ${z.nombre} ya envía datos`); render(true); }, 5000);
  },
  tarjeta: f => { const m = S.ui.modal; const c = f.c.value.trim().toUpperCase(); if (S.tarjetas.some(t=>t.id===c)){ m.err = `La tarjeta ${c} ya está registrada.`; m.code = c; renderModal(); return; } S.tarjetas.push({ id:c, estado:'Disponible', atencionId:null, ble:m.ble, desde:S.now }); audit('Dispositivos','Registró tarjeta',c,m.ble); closeModal(); toast(`${c} registrada y disponible`); render(); },
  usuario: f => {
    const m = S.ui.modal, n = f.n.value.trim(), c = f.c.value.trim().toLowerCase(), rol = m.rol || S.usuarios.find(x=>x.id===m.edit)?.rol || 'Operador';
    const pisos = [...f.querySelectorAll('input[name=p]:checked')].map(x=>x.value);
    if (S.usuarios.some(u=>u.correo===c && u.id!==m.edit)){ m.err = 'Ya existe un usuario con ese correo.'; renderModal(); $('#us-n').value = n; $('#us-c').value = c; return; }
    if (rol==='Operador' && !pisos.length){ m.err = 'Asigne al menos un piso al Operador.'; renderModal(); $('#us-n').value = n; $('#us-c').value = c; return; }
    if (m.edit){ const u = S.usuarios.find(x=>x.id===m.edit); const antes = u.rol; Object.assign(u, { nombre:n, correo:c, rol, pisos: rol==='Operador'?pisos:S.pisos.map(p=>p.id) }); audit('Usuarios','Editó usuario',n, antes!==rol?`${antes} → ${rol}`:'Datos actualizados'); closeModal(); toast('Cambios guardados'); render(); return; }
    const pass = tempPass(); S.usuarios.push({ id:'u'+Date.now(), nombre:n, correo:c, rol, pisos: rol==='Operador'?pisos:S.pisos.map(p=>p.id), estado:'Primer ingreso', pass, ultimo:null });
    audit('Usuarios','Creó usuario',n,`Rol ${rol}${rol==='Operador'?' · '+pisos.map(id=>pisoById(id).nombre).join(', '):''}`);
    openModal({ type:'usuario', pass, nombre:n }); render();
  }
};

/* ---- Inputs ---- */
const I = {
  piso: el => { S.ui.piso = el.value; render(); },
  hRango: el => { S.ui.hRango = el.value; S.ui.hPage = 0; render(); },
  hDesde: el => { S.ui.hDesde = el.value; render(); }, hHasta: el => { S.ui.hHasta = el.value; render(); },
  hPiso: el => { S.ui.hPiso = el.value; S.ui.hZona = ''; S.ui.hPage = 0; render(); },
  hZona: el => { S.ui.hZona = el.value; S.ui.hPage = 0; render(); },
  hQ: el => { S.ui.hQ = el.value; S.ui.hPage = 0; render(); },
  usrQ: el => { S.ui.usrQ = el.value; render(); }, usrRol: el => { S.ui.usrRol = el.value; render(); },
  audU: el => { S.ui.audU = el.value; render(); }, audT: el => { S.ui.audT = el.value; render(); },
  pwcheck: el => { const c = $('#pwchecks'); if (c) c.innerHTML = pwChecks(el.value); },
  edNodo: el => { S.ed.nodo = el.value; },
  mf: el => { const m = S.ui.modal; m[el.dataset.k] = el.value; if (el.dataset.k==='ancho' && m.type==='piso') m.fondo = Math.round(+el.value*(m.ratio||13/24)*2)/2; if (el.dataset.k==='piso'){ m.zona = pisoById(el.value).zonas.find(z=>z.tipo!=='Tránsito')?.id; renderModal(); } else if (m.type==='piso' && el.dataset.k!=='ancho') { const b = $('#modal .m-f .btn-p'); if (b) b.disabled = !m.nombre; } else if (m.type==='piso') renderModal(); },
  planoFile: el => { const f = el.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { const m = S.ui.modal; m.plano = r.result; m.planoNombre = f.name; const img = new Image(); img.onload = () => { m.ratio = img.naturalHeight/img.naturalWidth; m.fondo = Math.round(m.ancho*m.ratio*2)/2; renderModal(); }; img.src = r.result; }; r.readAsDataURL(f); },
  zprop: el => {
    const p = pisoById(S.ed.pisoId), z = borr(p).find(x=>x.id===S.ed.sel); if (!z) return;
    const k = el.dataset.k, v = el.value;
    if (k==='nombre') z.nombre = v; if (k==='aforo') z.aforo = Math.max(1, +v||1);
    if (k==='u0') z.umb[0] = clamp(+v||0, 0, z.umb[1]); if (k==='u1') z.umb[1] = clamp(+v||0, z.umb[0], 200);
    p.dirty = true; $('#edwrap').innerHTML = edSVG(p); $('#edprev').innerHTML = isoSVG([p],{ mini:true, zonas:borr(p), s:9 });
  }
};

/* ---- Eventos globales ---- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (!t){ if (S.ui.bell || S.ui.menu){ if (!e.target.closest('.dd')){ S.ui.bell = false; S.ui.menu = false; S.alertas.forEach(a=>a.leida = true); render(); } } return; }
  if (t.tagName==='A') return;
  const fn = A[t.dataset.a]; if (fn){ if (t.tagName==='BUTTON' && t.type!=='submit') e.preventDefault(); fn(t, e); }
});
document.addEventListener('submit', e => { const f = e.target.closest('[data-f]'); if (f){ e.preventDefault(); F[f.dataset.f]?.(f); } });
document.addEventListener('input', e => { const el = e.target.closest('[data-i]'); if (el && el.type!=='file' && el.tagName!=='SELECT') I[el.dataset.i]?.(el); });
document.addEventListener('change', e => { const el = e.target.closest('[data-i]'); if (el && (el.tagName==='SELECT' || el.type==='file' || el.type==='date')) I[el.dataset.i]?.(el); });
document.addEventListener('keydown', e => { if (e.key==='Escape' && S.ui.modal) closeModal(); });
// Tooltip del gemelo
document.addEventListener('mouseover', e => {
  const g = e.target.closest('#stage [data-zona]'); const tip = $('#tip');
  if (!g){ tip.hidden = true; return; }
  const z = zonaById(g.dataset.zona), lv = nivel(z), n = nodoDeZona(z), at = enZona(z);
  const esp = avg(at.map(a=>mins(S.now - a.eventos[a.eventos.length-1].entrada)));
  tip.innerHTML = `<b>${esc(z.nombre)}</b><div>${lv==='nd'?'Sin datos':lv==='pausa'?'Seguimiento pausado':`${at.length}/${z.aforo} pacientes · concentración ${NIV[lv].toLowerCase()}`}</div>${lv!=='nd'&&lv!=='pausa'&&at.length?`<div>Permanencia prom. ahora: ${esp} min</div>`:''}<div>Nodo ${n?`${n.id} ${n.estado.toLowerCase()}`:'no instalado'}</div><div style="color:#FBB62F;margin-top:4px">Clic para ver el detalle</div>`;
  tip.hidden = false;
});
document.addEventListener('mousemove', e => { const tip = $('#tip'); if (!tip.hidden){ tip.style.left = Math.min(innerWidth-230, e.clientX+14)+'px'; tip.style.top = (e.clientY+14)+'px'; } });

// Editor: arrastre
function svgPt(svg, e){ const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const r = pt.matrixTransform(svg.getScreenCTM().inverse()); return [r.x/30, r.y/30]; }
const snap = v => Math.round(v*2)/2;
document.addEventListener('pointerdown', e => {
  const svg = e.target.closest('#edsvg'); if (!svg) return;
  const p = pisoById(S.ed.pisoId), zs = borr(p); const [mx,my] = svgPt(svg, e);
  if (S.ed.tool==='rect'){ const z = { id:'z-'+Date.now(), nombre:'Zona nueva', tipo:'Espera', aforo:10, umb:[50,80], x:snap(mx), y:snap(my), w:0, h:0, pausa:null }; zs.push(z); S.ed.sel = z.id; S.ed.drag = { kind:'new', z, ox:snap(mx), oy:snap(my) }; }
  else if (S.ed.tool==='nodo'){ const n = S.nodos.find(x=>x.id===S.ed.nodo); if (!n) return; const z = zs.find(z=>mx>=z.x&&mx<=z.x+z.w&&my>=z.y&&my<=z.y+z.h && z.tipo!=='Tránsito'); n.x = snap(mx); n.y = snap(my); n.pisoId = p.id; if (z) n.zonaId = z.id; audit('Gemelo','Ubicó nodo',n.id,`${p.nombre} · ${z?z.nombre:'sin zona'}`); toast(`${n.id} ubicado${z?' en '+z.nombre:''}`); render(); return; }
  else {
    const h = e.target.closest('[data-h]'), g = e.target.closest('[data-ez]');
    if (h){ const z = zs.find(x=>x.id===S.ed.sel); S.ed.drag = { kind:'resize', h:h.dataset.h, z, o:{...z} }; }
    else if (g){ const z = zs.find(x=>x.id===g.dataset.ez); if (S.ed.sel!==z.id){ S.ed.sel = z.id; } S.ed.drag = { kind:'move', z, dx:mx-z.x, dy:my-z.y, moved:false }; }
    else { S.ed.sel = null; render(); return; }
  }
  svg.setPointerCapture?.(e.pointerId); e.preventDefault();
  $('#edwrap').innerHTML = edSVG(p);
});
document.addEventListener('pointermove', e => {
  const d = S.ed.drag; if (!d) return; const svg = $('#edsvg'); if (!svg) return;
  const p = pisoById(S.ed.pisoId); const [mx,my] = svgPt(svg, e); const z = d.z;
  if (d.kind==='new'){ const x1 = clamp(snap(mx),0,p.ancho), y1 = clamp(snap(my),0,p.fondo); z.x = Math.min(d.ox,x1); z.y = Math.min(d.oy,y1); z.w = Math.abs(x1-d.ox); z.h = Math.abs(y1-d.oy); }
  if (d.kind==='move'){ z.x = clamp(snap(mx-d.dx),0,p.ancho-z.w); z.y = clamp(snap(my-d.dy),0,p.fondo-z.h); d.moved = true; }
  if (d.kind==='resize'){ const o = d.o, X = clamp(snap(mx),0,p.ancho), Y = clamp(snap(my),0,p.fondo);
    let x0 = o.x, y0 = o.y, x1 = o.x+o.w, y1 = o.y+o.h;
    if (d.h.includes('w')) x0 = Math.min(X, x1-1); if (d.h.includes('e')) x1 = Math.max(X, x0+1);
    if (d.h.includes('n')) y0 = Math.min(Y, y1-1); if (d.h.includes('s')) y1 = Math.max(Y, y0+1);
    Object.assign(z, { x:x0, y:y0, w:x1-x0, h:y1-y0 }); }
  $('#edwrap').innerHTML = edSVG(p);
});
document.addEventListener('pointerup', () => {
  const d = S.ed.drag; if (!d) return; S.ed.drag = null;
  const p = pisoById(S.ed.pisoId);
  if (d.kind==='new'){ if (d.z.w < 1 || d.z.h < 1){ p.borrador = borr(p).filter(z=>z!==d.z); S.ed.sel = null; } else { S.ed.tool = 'sel'; p.dirty = true; toast('Zona creada. Complete sus propiedades a la derecha.'); } }
  else if (d.kind==='resize' || d.moved) p.dirty = true;
  render();
});

/* ---- Router ---- */
function route(){
  const r = location.hash.slice(1) || 'login';
  if (!S.user){ S.route = 'login'; if (r!=='login') history.replaceState(null,'','#login'); }
  else if (r==='login'){ go(home()); return; }
  else S.route = TITLES[r] ? r : home();
  S.ui.bell = false; S.ui.menu = false; S.ui.modal = null;
  if (S.route!=='admision'){ S.ui.admRes = null; }
  render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

seedData();
route();
setInterval(tick, 8000);
</script>
