<div class="r3d-lienzo" #lienzo></div>

@switch (estado()) {
  @case ('cargando') {
    <div class="r3d-aviso" role="status"><span class="r3d-spin" aria-hidden="true"></span>Cargando la maqueta 3D…</div>
  }
  @case ('error') {
    <div class="r3d-aviso r3d-error" role="alert">
      <b>No se pudo cargar la maqueta 3D</b>
      <span>Recarga la página. Si sigue sin verse, avisa al Administrador.</span>
    </div>
  }
}

<div class="r3d-controles">
  <button class="btn btn-o btn-sm" type="button" (click)="vistaInicial()" title="Volver a la vista inicial">Recentrar</button>
</div>
